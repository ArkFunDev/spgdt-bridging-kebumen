name: PHP lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mysqli

      - name: Syntax check all PHP files
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate config template structure
        run: >
          php -r '$c = require "config.example.php";
          exit(is_array($c) && isset($c["api"], $c["db"], $c["capacity"]) ? 0 : 1);'
